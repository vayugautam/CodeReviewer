services:
  backend:
    build: ./backend
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your shell or .env file}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FRONTEND_ORIGIN: http://localhost:8080
    expose:
      - "8000"
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
